# =============================================================================
# GLOBAL PLUGINS — apply to all services
# =============================================================================
plugins:

  # Prometheus metrics at http://localhost:8081/metrics
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # Adds X-Correlation-ID to every request — trace across services in Grafana
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  # CORS — allow your React frontend to call Kong
  - name: cors
    config:
      origins:
        - "http://localhost:3000"   # React / API gateway dev
        - "http://localhost:5173"   # Vite dev server
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-ID
      exposed_headers:
        - X-Correlation-ID
      credentials: true
      max_age: 3600