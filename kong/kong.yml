_format_version: "3.0"
_transform: true

# =============================================================================
# ROUTEMATE - KONG DECLARATIVE CONFIG (COMPLETE)
# =============================================================================
# Public proxy:  http://localhost:8080
# Admin API:     http://localhost:8081
# Reload config: curl -X POST http://localhost:8081/config -F config=@kong/kong.yml
# =============================================================================

services:

  # ── User Service (port 3012) ✅ ──────────────────────────────────────────
  - name: user-service
    url: http://host.docker.internal:3012
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: user-service-health
        paths: [/user-service]
        methods: [GET]
        strip_path: false
      - name: user-register
        paths: [/user-service/register]
        methods: [POST]
        strip_path: false
      - name: user-login
        paths: [/user-service/login]
        methods: [POST]
        strip_path: false
      - name: user-list
        paths: [/user-service/users]
        methods: [GET]
        strip_path: false
      - name: user-by-id
        paths: [/user-service/users]
        methods: [GET, PATCH]
        strip_path: false
      - name: user-change-password
        paths: [/user-service/users]
        methods: [PATCH]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true

