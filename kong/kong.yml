services:

  # ── Route Planner Orchestrator (port 3014) ✅ ────────────────────────────
  - name: route-planner-orchestrator
    url: http://host.docker.internal:3014
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: route-planner-search
        paths:
          - /route-planner/search
        methods: [POST]
        strip_path: false
      - name: route-planner-select
        paths:
          - /route-planner/select
        methods: [PATCH]
        strip_path: false
      - name: route-planner-routes
        paths:
          - /route-planner/routes
        methods: [GET]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true

